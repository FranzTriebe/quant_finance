[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "quantlab"
version = "0.1.0"
description = "Research engine for backtesting and validating trading strategies"
requires-python = ">=3.11"

[tool.setuptools]
packages = ["quantlab"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
